<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAA · Handmade Woodwork</title>
<meta name="description" content="LAA: a gallery of handmade wood pieces.">
<meta name="theme-color" content="#1F2A23">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=satoshi@400,500,700&display=swap">
<style>
  /* one warm look on purpose: forest-green bands, cream paper, oiled-oak accent */
  :root { --forest: #1F2A23; --green: #2E3B32; --sage: #A9C3A6; --cream: #F2EEE6; --paper: #F6F2EA; --tile: #EDE6D8;
    --ink: #1D2620; --muted: #6B736A; --oak: #B97A3E; --line: #E0D8C8;
    --display: "Clash Display", "Segoe UI", system-ui, sans-serif; --body: "Satoshi", "Segoe UI", system-ui, sans-serif; color-scheme: light }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 var(--body); -webkit-font-smoothing: antialiased }
  .wrap { max-width: 1180px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)) }

  /* hero: green band with a soft glow; the featured photo hangs over its lower edge */
  .hero { background: radial-gradient(60% 90% at 85% 0%, rgb(169 195 166 / .22), transparent 70%), linear-gradient(160deg, #26342B, var(--forest) 70%); color: var(--cream) }
  /* the logo alone, centred; the featured photo centred beneath it */
  .hero .wrap { display: grid; justify-items: center; gap: clamp(30px, 5vw, 52px); padding-top: clamp(48px, 8vw, 92px) }
  .brand { display: grid; justify-items: center; gap: 22px }
  .brand img { width: clamp(150px, 22vw, 240px); height: auto; aspect-ratio: 100 / 75.83; filter: drop-shadow(0 16px 30px rgb(0 0 0 / .4)) }
  .brand .rule { width: 64px; height: 3px; border-radius: 3px; background: var(--oak) }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
  .featured { width: min(100%, 520px); margin-bottom: clamp(-120px, -9vw, -60px); position: relative; z-index: 2 }
  @media (max-width: 760px) { .featured { margin-bottom: -56px } }

  /* cards: every one sits in a fixed-shape frame, tilts gently toward the pointer */
  .card { all: unset; box-sizing: border-box; display: block; width: 100%; aspect-ratio: 4 / 5; border-radius: 20px; overflow: hidden; position: relative; cursor: zoom-in; background: var(--tile);
    box-shadow: 0 1px 0 rgb(255 255 255 / .6) inset, 0 24px 48px -26px rgb(31 42 35 / .55);
    transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s }
  .card:hover { box-shadow: 0 1px 0 rgb(255 255 255 / .6) inset, 0 34px 60px -26px rgb(31 42 35 / .65) }
  .card:focus-visible { outline: 2px solid var(--oak); outline-offset: 4px }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s cubic-bezier(.2,.8,.2,1) }
  .reel .card { padding: 10px; background: #FCFAF5; aspect-ratio: auto; border-radius: 18px; box-shadow: 0 1px 2px rgb(31 42 35 / .06), 0 18px 36px -22px rgb(31 42 35 / .45) }
  .reel .card img { aspect-ratio: 4 / 5; height: auto; border-radius: 11px }
  .reel .chip { left: 20px; top: 20px }
  .card:hover img { transform: scale(1.04) }
  .chip { position: absolute; left: 12px; top: 12px; padding: 5px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; background: rgb(246 242 234 / .9); color: var(--muted); backdrop-filter: blur(4px) }
  .featured .card { box-shadow: 0 30px 50px -28px rgb(0 0 0 / .55) }

  /* the work */
  .work { padding-top: clamp(120px, 13vw, 180px); padding-bottom: 80px }
  @media (max-width: 760px) { .work { padding-top: 92px } }
  .work-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 26px }
  .work-head h2 { font: 600 clamp(30px, 4vw, 42px)/1 var(--display); letter-spacing: .01em; margin: 0 }
  .work-head span { color: var(--muted); font-size: 14px }
  /* the reel: one line of pieces you swipe or step through; the centred one is shown full size */
  .reel { display: flex; gap: clamp(16px, 3vw, 32px); overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
    padding: 10px calc(100% - var(--slide)) 30px max(20px, env(safe-area-inset-left)); scroll-padding-inline: max(20px, env(safe-area-inset-left)); margin: 0 calc(-1 * max(20px, env(safe-area-inset-left))); scrollbar-width: none; --slide: clamp(250px, 28vw, 340px);
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 90px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 90px), transparent) }
  .reel::-webkit-scrollbar { display: none }
  .reel:focus-visible { outline: 2px solid var(--oak); outline-offset: -2px; border-radius: 12px }
  .piece { margin: 0; flex: 0 0 var(--slide); scroll-snap-align: start; transition: opacity .5s; opacity: .62 }
  .piece.on { opacity: 1 }
  .piece:hover { opacity: 1 }
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 6px }
  .progress { flex: 1; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; max-width: 420px }
  .progress i { display: block; height: 100%; width: 0; background: var(--oak); transition: width .4s }
  .step { display: flex; align-items: center; gap: 10px }
  .step b { font: 500 14px var(--body); font-variant-numeric: tabular-nums; color: var(--muted); min-width: 64px; text-align: center }
  .arrow { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 20px; cursor: pointer; transition: background .2s, transform .2s }
  .arrow:hover { background: var(--tile); transform: translateY(-1px) }
  .arrow:disabled { opacity: .35; cursor: default; transform: none }
  .arrow:focus-visible { outline: 2px solid var(--oak); outline-offset: 2px }
  .cap { display: flex; gap: 12px; align-items: baseline; margin-top: 14px }
  .cap .n { font: 500 13px var(--body); color: var(--oak); font-variant-numeric: tabular-nums }
  .cap .name { font: 600 19px/1.2 var(--display); letter-spacing: .01em }

  footer { background: var(--forest); color: var(--cream) }
  footer .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 26px 34px; font-size: 14px }
  footer img { width: 34px; height: auto; aspect-ratio: 100 / 75.83; vertical-align: middle; margin-right: 12px }
  footer .dim { color: var(--sage) }

  /* viewer */
  dialog { border: 0; padding: 0; background: transparent; max-width: min(94vw, 1000px); overflow: visible; color: var(--cream) }
  dialog::backdrop { background: rgb(20 28 23 / .86); backdrop-filter: blur(12px) }
  dialog img { display: block; max-width: 100%; max-height: 82svh; border-radius: 16px }
  dialog p { margin: 12px 4px 0; display: flex; justify-content: space-between; gap: 12px; font: 600 19px var(--display) }
  dialog p small { font: 500 13px var(--body); color: var(--sage) }
  .dlg-btn { position: absolute; top: 10px; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgb(31 42 35 / .8); color: var(--cream); font-size: 20px; cursor: pointer }
  .dlg-btn:focus-visible { outline: 2px solid var(--oak) }
  #close { right: 10px } #prev { left: 10px; top: 50% } #next { right: 10px; top: 50% }
  [hidden] { display: none !important }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important } .card { transform: none !important } }
</style>
</head>
<body>
<section class="hero">
  <div class="wrap">
    <div class="brand"><h1 class="sr">LAA</h1><img src="logo-cream.svg" alt="LAA logo" width="240" height="182"><div class="rule"></div></div>
    <div class="featured" id="featured"></div>
  </div>
</section>

<main class="work wrap">
  <div class="work-head"><h2>The work</h2><span id="count"></span></div>
  <div class="reel" id="reel" tabindex="0" aria-label="Pieces, swipe or use the arrows"></div>
  <div class="controls">
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <div class="step"><button class="arrow" id="back" aria-label="Previous piece">‹</button><b id="where"></b><button class="arrow" id="fwd" aria-label="Next piece">›</button></div>
  </div>
</main>

<footer><div class="wrap"><span><img src="logo-cream.svg" alt="" width="34" height="26">© LAA</span><span class="dim">Handmade woodwork</span></div></footer>

<dialog id="viewer" aria-label="Photo">
  <button class="dlg-btn" id="close" aria-label="Close">×</button>
  <button class="dlg-btn" id="prev" aria-label="Previous">‹</button>
  <button class="dlg-btn" id="next" aria-label="Next">›</button>
  <img id="big" alt="">
  <p><span id="caption"></span><small id="pos"></small></p>
</dialog>

<script>
// The gallery. The first entry is the big one at the top.
// To add a real photo: put it in the photos folder and set photo: "photos/your-file.jpg".
// Until then a piece shows its drawing (drawn: ...) with a "Drawing · photo soon" label.
const PIECES = [
  { name: "Stargazing Chair", photo: "photos/stargazing-chair.png" },
  { name: "Wine & Glass Caddy", photo: "", drawn: "photos/drawn/caddy.jpg" },
  { name: "Wine Bottle Wind Chimes", photo: "", drawn: "photos/drawn/chimes.jpg" },
  { name: "Magic Wine Holder", photo: "", drawn: "photos/drawn/wine.jpg" },
  { name: "Folding Stool", photo: "", drawn: "photos/drawn/stool.jpg" },
  { name: "Beer Flight", photo: "", drawn: "photos/drawn/flight.jpg" },
];

const viewer = document.getElementById("viewer"), still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const pad = (n) => String(n).padStart(2, "0");
const src = (p) => p.photo || p.drawn;
const SHOWN = PIECES.filter(src);
document.getElementById("count").textContent = `${PIECES.length} pieces`;
let at = 0;

function show(i) {
  at = (i + SHOWN.length) % SHOWN.length;
  const p = SHOWN[at], big = document.getElementById("big");
  big.src = src(p); big.alt = p.name;
  document.getElementById("caption").textContent = p.name;
  document.getElementById("pos").textContent = (p.photo ? "" : "Drawing · photo soon   ") + `${pad(at + 1)} / ${pad(SHOWN.length)}`;
  for (const id of ["prev", "next"]) document.getElementById(id).hidden = SHOWN.length < 2;
  if (!viewer.open) viewer.showModal();
}

function card(p) {
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "card";
  btn.setAttribute("aria-label", "Open " + p.name);
  const img = document.createElement("img");
  img.src = src(p); img.alt = p.photo ? p.name : "Drawing of " + p.name; img.loading = "lazy";
  btn.appendChild(img);
  if (!p.photo) { const c = document.createElement("span"); c.className = "chip"; c.textContent = "Drawing · photo soon"; btn.appendChild(c); }
  btn.addEventListener("click", () => show(SHOWN.indexOf(p)));
  if (!still) {
    btn.addEventListener("pointermove", (e) => {
      const r = btn.getBoundingClientRect();
      btn.style.setProperty("--ry", (((e.clientX - r.left) / r.width - 0.5) * 7).toFixed(2) + "deg");
      btn.style.setProperty("--rx", (-((e.clientY - r.top) / r.height - 0.5) * 7).toFixed(2) + "deg");
    });
    btn.addEventListener("pointerleave", () => { btn.style.removeProperty("--rx"); btn.style.removeProperty("--ry"); });
  }
  return btn;
}

PIECES.forEach((p, i) => {
  if (!src(p)) return;
  if (i === 0) { const f = card(p); f.querySelector("img").loading = "eager"; document.getElementById("featured").appendChild(f); return; }
  const fig = document.createElement("figure");
  fig.className = "piece";
  fig.appendChild(card(p));
  const cap = document.createElement("figcaption");
  cap.className = "cap";
  cap.innerHTML = `<span class="n"></span><span class="name"></span>`;
  cap.querySelector(".n").textContent = pad(i + 1);
  cap.querySelector(".name").textContent = p.name;
  fig.appendChild(cap);
  document.getElementById("reel").appendChild(fig);
});

// which piece is centred: drives the counter, the bar, the arrows and the full-size highlight
const reel = document.getElementById("reel"), slides = [...reel.children];
let current = 0;
function mark(i) {
  current = i;
  slides.forEach((s, j) => s.classList.toggle("on", j === i));
  document.getElementById("where").textContent = `${pad(i + 1)} / ${pad(slides.length)}`;
  document.getElementById("bar").style.width = ((i + 1) / slides.length) * 100 + "%";
  document.getElementById("back").disabled = i === 0;
  document.getElementById("fwd").disabled = i === slides.length - 1;
}
const go = (i) => slides[Math.max(0, Math.min(slides.length - 1, i))]?.scrollIntoView({ behavior: still ? "auto" : "smooth", inline: "start", block: "nearest" });
// the current piece is the one snapped to the left edge
const sync = () => {
  const step = slides[1] ? slides[1].offsetLeft - slides[0].offsetLeft : 1;
  mark(Math.min(slides.length - 1, Math.round(reel.scrollLeft / step)));
};
reel.addEventListener("scroll", () => requestAnimationFrame(sync), { passive: true });
document.getElementById("back").onclick = () => go(current - 1);
document.getElementById("fwd").onclick = () => go(current + 1);
reel.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") { e.preventDefault(); go(current + 1); } if (e.key === "ArrowLeft") { e.preventDefault(); go(current - 1); } });
if (slides.length) mark(0);

document.getElementById("close").onclick = () => viewer.close();
document.getElementById("prev").onclick = () => show(at - 1);
document.getElementById("next").onclick = () => show(at + 1);
viewer.addEventListener("click", (e) => { if (e.target === viewer) viewer.close(); });
viewer.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") show(at - 1); if (e.key === "ArrowRight") show(at + 1); });
</script>
</body>
</html>
