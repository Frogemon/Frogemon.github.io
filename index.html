<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAA · Handmade Woodwork</title>
<meta name="description" content="LAA: photos of handmade wood pieces.">
<meta name="theme-color" content="#1F2A23">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  /* forest-green band for the mark, then a deck of photos on cream */
  :root { --forest: #1F2A23; --sage: #A9C3A6; --cream: #F2EEE6; --paper: #EFE9DE; --oak: #B97A3E; color-scheme: light }
  * { box-sizing: border-box }
  html, body { margin: 0 }
  body { background: var(--paper); color: #1D2620; font: 16px/1.5 "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }

  header { background: radial-gradient(60% 120% at 50% 0%, rgb(169 195 166 / .2), transparent 70%), linear-gradient(170deg, #26342B, var(--forest) 70%);
    display: grid; justify-items: center; gap: 22px; padding: clamp(46px, 8vw, 88px) 20px clamp(40px, 6vw, 64px) }
  header img { width: clamp(140px, 20vw, 220px); height: auto; aspect-ratio: 100 / 75.83; filter: drop-shadow(0 16px 30px rgb(0 0 0 / .4)) }
  header .rule { width: 60px; height: 3px; border-radius: 3px; background: var(--oak) }

  /* the deck: cards stacked, the top one follows your finger and flies off when flung */
  main { display: grid; justify-items: center; gap: 26px; padding: clamp(40px, 7vw, 76px) 20px clamp(56px, 8vw, 96px) }
  .row { display: flex; align-items: center; gap: clamp(14px, 4vw, 44px) }
  .deck { position: relative; margin-bottom: 18px; width: min(78vw, 400px); aspect-ratio: 4 / 5; touch-action: pan-y; user-select: none; -webkit-user-select: none }
  .card { position: absolute; inset: 0; border-radius: 22px; overflow: hidden; background: #EDE6D8; cursor: grab;
    box-shadow: 0 2px 4px rgb(31 42 35 / .08), 0 24px 50px -24px rgb(31 42 35 / .55);
    transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .45s; will-change: transform }
  .card.dragging { transition: none; cursor: grabbing }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none }
  .card img.drawn { object-fit: contain; padding: 6% }
  .nav { width: 50px; height: 50px; flex: none; border-radius: 50%; border: 1px solid #DCD3C3; background: #FBF8F2; color: #1D2620; font-size: 22px; cursor: pointer;
    box-shadow: 0 6px 14px -8px rgb(31 42 35 / .4); transition: transform .2s, background .2s }
  .nav:hover { transform: translateY(-2px); background: #fff }
  .nav:focus-visible, .deck:focus-visible { outline: 2px solid var(--oak); outline-offset: 4px }
  .nav { display: none }
  @media (hover: hover) and (pointer: fine) and (min-width: 700px) { .nav { display: block } }
  .dots { display: flex; gap: 8px }
  .dots i { width: 7px; height: 7px; border-radius: 99px; background: #D3C9B7; transition: width .35s, background .35s }
  .dots i.on { width: 22px; background: var(--oak) }

  footer { display: flex; justify-content: center; padding: 0 20px 40px }
  footer img { width: 36px; height: auto; aspect-ratio: 100 / 75.83; opacity: .55 }

  /* full-screen view when a card is tapped */
  .stage { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgb(18 24 20 / .92) }
  .stage[hidden] { display: none }
  .stage img { max-width: min(92vw, 1100px); max-height: 86svh; border-radius: 10px; box-shadow: 0 40px 90px -30px #000; animation: grow .35s cubic-bezier(.2,.8,.2,1) }
  @keyframes grow { from { opacity: 0; transform: scale(.94) } }
  .stage button { position: fixed; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); width: 48px; height: 48px; border-radius: 50%; border: 0;
    background: rgb(242 238 230 / .14); color: var(--cream); font-size: 22px; cursor: pointer }
  .stage button:focus-visible { outline: 2px solid var(--oak) }
  /* arrival: the mark rises, the oak rule draws itself, the controls fade up after the cards are dealt */
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.97) } }
  @keyframes draw { from { width: 0; opacity: 0 } }
  @keyframes fade { from { opacity: 0; transform: translateY(8px) } }
  header img { animation: rise 1s cubic-bezier(.2,.8,.2,1) both }
  header .rule { animation: draw .9s .45s cubic-bezier(.2,.8,.2,1) both }
  .nav { animation: fade .8s 1.1s ease-out both }
  .dots { animation: fade .8s 1.2s ease-out both }
  footer img { animation: fade 1s 1.4s ease-out both }
  .card img { transition: opacity .6s ease-out }
  .card img.loading { opacity: 0 }
  @media (prefers-reduced-motion: reduce) { .card, .dots i, .card img { transition: none } .stage img, header img, header .rule, .nav, .dots, footer img { animation: none } }
</style>
</head>
<body>
<header>
  <h1 class="sr">LAA</h1>
  <img src="logo-cream.svg" alt="LAA logo" width="220" height="167">
  <div class="rule"></div>
</header>

<main>
  <div class="row">
    <button class="nav" id="prev" aria-label="Previous photo">‹</button>
    <div class="deck" id="deck" tabindex="0" aria-label="Photos: swipe, drag, or use the arrow keys" aria-roledescription="photo stack"></div>
    <button class="nav" id="next" aria-label="Next photo">›</button>
  </div>
  <div class="dots" id="dots" aria-hidden="true"></div>
</main>

<footer><img src="logo.svg" alt="" width="36" height="27"></footer>

<div class="stage" id="stage" hidden role="dialog" aria-modal="true" aria-label="Photo">
  <img id="s-img" alt="">
  <button id="s-close" aria-label="Close">×</button>
</div>

<script>
// The photos. To add one: put the file in the photos folder and add a line, or swap a drawing for the real photo.
const PHOTOS = [
  { name: "Stargazing Chair", src: "photos/stargazing-chair.png" },
  { name: "Wine & Glass Caddy", src: "photos/drawn/caddy.jpg" },
  { name: "Wine Bottle Wind Chimes", src: "photos/drawn/chimes.jpg" },
  { name: "Magic Wine Holder", src: "photos/drawn/wine.jpg" },
  { name: "Folding Stool", src: "photos/drawn/stool.jpg" },
  { name: "Beer Flight", src: "photos/drawn/flight.jpg" },
];

const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const deck = document.getElementById("deck"), dots = document.getElementById("dots");
const cards = PHOTOS.map((p) => {
  const c = document.createElement("div");
  c.className = "card";
  const img = document.createElement("img");
  img.className = "loading";
  img.addEventListener("load", () => img.classList.remove("loading"), { once: true });
  img.src = p.src; img.alt = p.name; img.draggable = false;
  if (img.complete) img.classList.remove("loading");
  if (p.src.includes("/drawn/")) img.classList.add("drawn"); // drawings show whole; real photos fill the card
  c.appendChild(img);
  deck.appendChild(c);
  return c;
});
dots.innerHTML = PHOTOS.map(() => "<i></i>").join("");
let order = PHOTOS.map((_, i) => i); // order[0] is the card on top

// the top card sits flat; the next two peek out underneath, a little lower, smaller and tilted
const TILT = [0, -4.5, 4];
function layout() {
  order.forEach((ci, depth) => {
    const c = cards[ci];
    c.style.zIndex = PHOTOS.length - depth;
    c.style.opacity = depth < 3 ? 1 : 0;
    c.style.transform = depth < 3 ? `translate(${depth * (depth === 1 ? -8 : 8)}px, ${depth * 8}px) scale(${1 - depth * 0.035}) rotate(${TILT[depth]}deg)` : "translateY(28px) scale(.9)";
    c.setAttribute("aria-hidden", depth === 0 ? "false" : "true");
  });
  [...dots.children].forEach((d, i) => d.classList.toggle("on", i === order[0]));
  deck.setAttribute("aria-label", `Photo ${order[0] + 1} of ${PHOTOS.length}: ${PHOTOS[order[0]].name}. Swipe, drag, or use the arrow keys.`);
}

// throw the top card off one side, then tuck it in at the back of the stack
let busy = false;
function swipe(dir, fromX = 0, fromY = 0) {
  if (busy) return;
  busy = true;
  const top = cards[order[0]];
  top.classList.remove("dragging");
  const done = () => {
    order.push(order.shift());
    top.style.transition = "none";
    layout();
    top.offsetHeight; // apply the back-of-stack spot before animations resume
    top.style.transition = "";
    busy = false;
  };
  if (still) return done();
  top.style.transform = `translate(${dir * (innerWidth * 0.75 + 200)}px, ${fromY + 40}px) rotate(${dir * 24}deg)`;
  top.style.opacity = "0";
  setTimeout(done, 420);
}
function back() {
  if (busy) return;
  order.unshift(order.pop()); // bring the last card back on top
  layout();
}

// dragging the top card
let drag = null;
deck.addEventListener("pointerdown", (e) => {
  const top = cards[order[0]];
  if (busy || !top.contains(e.target)) return;
  drag = { x: e.clientX, y: e.clientY, t: performance.now(), dx: 0, dy: 0, card: top, id: e.pointerId };
  top.classList.add("dragging");
  top.setPointerCapture(e.pointerId);
});
deck.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.dx = e.clientX - drag.x; drag.dy = e.clientY - drag.y;
  drag.card.style.transform = `translate(${drag.dx}px, ${drag.dy * 0.4}px) rotate(${drag.dx * 0.06}deg)`;
});
function release(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const { dx, dy, card, t } = drag;
  drag = null;
  const speed = Math.abs(dx) / Math.max(1, performance.now() - t);
  if (Math.abs(dx) > 110 || (Math.abs(dx) > 40 && speed > 0.6)) return swipe(Math.sign(dx), dx, dy * 0.4);
  card.classList.remove("dragging");
  layout(); // spring back
  if (Math.abs(dx) < 6 && Math.abs(dy) < 6 && e.type === "pointerup") view(order[0]);
}
deck.addEventListener("pointerup", release);
deck.addEventListener("pointercancel", release);
document.getElementById("next").onclick = () => swipe(1);
document.getElementById("prev").onclick = back;
deck.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") { e.preventDefault(); swipe(1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); back(); }
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); view(order[0]); }
});

// tap: see the photo full screen
const stage = document.getElementById("stage"), big = document.getElementById("s-img");
function view(i) {
  big.src = PHOTOS[i].src; big.alt = PHOTOS[i].name;
  stage.hidden = false; document.body.style.overflow = "hidden";
  document.getElementById("s-close").focus();
}
function closeView() { stage.hidden = true; document.body.style.overflow = ""; deck.focus(); }
document.getElementById("s-close").onclick = closeView;
stage.addEventListener("click", (e) => { if (e.target === stage) closeView(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !stage.hidden) closeView(); });

if (still) layout();
else {
  cards.forEach((c) => { c.style.transition = "none"; c.style.opacity = "0"; c.style.transform = "translateY(70px) scale(.92) rotate(-2deg)"; });
  deck.offsetHeight;
  order.slice().reverse().forEach((ci, k) => { cards[ci].style.transition = `transform .8s cubic-bezier(.2,.8,.2,1) ${0.35 + k * 0.08}s, opacity .6s ease-out ${0.35 + k * 0.08}s`; });
  layout();
  setTimeout(() => cards.forEach((c) => (c.style.transition = "")), 1700);
}
</script>
</body>
</html>
