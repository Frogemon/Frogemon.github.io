<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAA · Handmade Woodwork</title>
<meta name="description" content="LAA: a gallery of handmade wood pieces.">
<meta name="theme-color" content="#F4F2ED">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap">
<style>
  /* minimal catalogue: paper ground, ink type, one green accent; dark mode follows the phone */
  :root { --paper: #F4F2ED; --tile: #E9E6DF; --ink: #161A17; --muted: #7A7F79; --line: #D9D5CC; --accent: #2E3B32;
    --font: "General Sans", "Segoe UI", system-ui, sans-serif; color-scheme: light }
  @media (prefers-color-scheme: dark) { :root { --paper: #121513; --tile: #1B201C; --ink: #ECE8E0; --muted: #8C938B; --line: #2A302B; --accent: #A9C3A6; color-scheme: dark } }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased }
  .wrap { max-width: 1240px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)) }
  .num { font-variant-numeric: tabular-nums; color: var(--muted) }

  /* top bar */
  nav { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 86%, transparent); backdrop-filter: blur(10px) }
  nav .wrap { display: flex; justify-content: space-between; align-items: center; height: 60px; border-bottom: 1px solid var(--line) }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .08em; text-decoration: none; color: inherit }
  .brand img { width: 30px; height: auto; aspect-ratio: 100 / 75.83 }
  nav .count { font-size: 13px }

  /* intro: the name, large and quiet */
  .intro { padding-block: clamp(48px, 10vw, 120px) clamp(28px, 5vw, 56px) }
  .intro h1 { margin: 0; font-weight: 500; font-size: clamp(56px, 13vw, 168px); line-height: .9; letter-spacing: .01em }
  .intro .meta { display: flex; justify-content: space-between; gap: 16px; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted) }

  /* the work: a numbered index of pieces */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(18px, 3vw, 36px) clamp(14px, 2vw, 24px); padding-bottom: 96px }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
  @media (max-width: 540px) { .grid { grid-template-columns: 1fr } }
  .piece { margin: 0; display: grid; gap: 10px }
  .piece.lead { grid-column: span 2; grid-row: span 2 }
  @media (max-width: 540px) { .piece.lead { grid-column: auto; grid-row: auto } }
  .shot { all: unset; box-sizing: border-box; display: block; width: 100%; aspect-ratio: 4 / 5; background: var(--tile); overflow: hidden; border-radius: 4px; cursor: zoom-in; position: relative }
  .piece.lead .shot { aspect-ratio: auto; height: 100% ; min-height: 320px }
  @media (max-width: 540px) { .piece.lead .shot { aspect-ratio: 4 / 5; height: auto } }
  .shot:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .9s cubic-bezier(.2,.7,.2,1), opacity .6s }
  .shot:hover img { transform: scale(1.03) }
  .shot.soon { cursor: default; display: grid; place-items: center }
  .shot.soon img { width: 44px; height: auto; object-fit: contain; opacity: .18; filter: grayscale(1) }
  @media (prefers-color-scheme: dark) { .shot.soon img { filter: grayscale(1) invert(1) } }
  .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px }
  .cap span:first-child { display: flex; gap: 12px }
  .cap .tagline { color: var(--muted); font-size: 13px }

  footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-block: 22px 36px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted) }

  /* viewer */
  dialog { border: 0; padding: 0; background: transparent; max-width: min(94vw, 1100px); overflow: visible; color: #ECE8E0 }
  dialog::backdrop { background: rgb(12 14 13 / .9) }
  dialog img { display: block; max-width: 100%; max-height: 84svh; border-radius: 4px }
  dialog p { margin: 12px 2px 0; display: flex; justify-content: space-between; font-size: 14px }
  .dlg-btn { position: absolute; top: 10px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgb(18 21 19 / .7); color: #ECE8E0; font: 18px var(--font); cursor: pointer }
  .dlg-btn:focus-visible { outline: 2px solid #A9C3A6 }
  #close { right: 10px } #prev { left: 10px; top: 50% } #next { right: 10px; top: 50% }
  [hidden] { display: none !important }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="brand" href="#"><img src="logo.svg" alt="" width="30" height="23">LAA</a>
  <span class="count num" id="count"></span>
</div></nav>

<header class="intro wrap">
  <h1>LAA</h1>
  <div class="meta"><span>Handmade woodwork</span><span class="num" id="year"></span></div>
</header>

<main class="wrap"><div class="grid" id="grid"></div></main>

<footer><div class="wrap"><span>© LAA</span><span>frogemon.github.io</span></div></footer>

<dialog id="viewer" aria-label="Photo">
  <button class="dlg-btn" id="close" aria-label="Close">×</button>
  <button class="dlg-btn" id="prev" aria-label="Previous photo">‹</button>
  <button class="dlg-btn" id="next" aria-label="Next photo">›</button>
  <img id="big" alt="">
  <p><span id="caption"></span><span class="num" id="pos"></span></p>
</dialog>

<script>
// The gallery. The first entry is the big one. To add a picture: put the file in the photos folder
// and fill in its photo: "photos/your-file.jpg". Entries with photo: "" show as "Photo soon".
const PHOTOS = [
  { name: "Stargazing Chair", photo: "photos/stargazing-chair.png" },
  { name: "Wine & Glass Caddy", photo: "" },
  { name: "Wine Bottle Wind Chimes", photo: "" },
  { name: "Magic Wine Holder", photo: "" },
  { name: "Folding Stool", photo: "" },
  { name: "Beer Flight", photo: "" },
];
const SHOTS = PHOTOS.filter((p) => p.photo); // only real photos open in the viewer

const viewer = document.getElementById("viewer"), grid = document.getElementById("grid");
const pad = (n) => String(n).padStart(2, "0");
document.getElementById("count").textContent = `${pad(PHOTOS.length)} pieces`;
document.getElementById("year").textContent = new Date().getFullYear();
let at = 0;

function show(i) {
  at = (i + SHOTS.length) % SHOTS.length;
  const p = SHOTS[at], big = document.getElementById("big");
  big.src = p.photo; big.alt = p.name;
  document.getElementById("caption").textContent = p.name;
  document.getElementById("pos").textContent = SHOTS.length > 1 ? `${pad(at + 1)} / ${pad(SHOTS.length)}` : "";
  for (const id of ["prev", "next"]) document.getElementById(id).hidden = SHOTS.length < 2;
  if (!viewer.open) viewer.showModal();
}

PHOTOS.forEach((p, i) => {
  const fig = document.createElement("figure");
  fig.className = "piece" + (i === 0 ? " lead" : "");
  const shot = document.createElement(p.photo ? "button" : "div");
  shot.className = "shot" + (p.photo ? "" : " soon");
  const img = document.createElement("img");
  if (p.photo) {
    shot.type = "button";
    shot.setAttribute("aria-label", "Open photo: " + p.name);
    img.src = p.photo; img.alt = p.name; img.loading = i === 0 ? "eager" : "lazy";
    shot.addEventListener("click", () => show(SHOTS.indexOf(p)));
  } else {
    img.src = "logo.svg"; img.alt = "";
  }
  shot.appendChild(img);
  const cap = document.createElement("figcaption");
  cap.className = "cap";
  cap.innerHTML = `<span><span class="num"></span><span class="name"></span></span><span class="tagline"></span>`;
  cap.querySelector(".num").textContent = pad(i + 1);
  cap.querySelector(".name").textContent = p.name;
  cap.querySelector(".tagline").textContent = p.photo ? "" : "Photo soon";
  fig.append(shot, cap);
  grid.appendChild(fig);
});

document.getElementById("close").onclick = () => viewer.close();
document.getElementById("prev").onclick = () => show(at - 1);
document.getElementById("next").onclick = () => show(at + 1);
viewer.addEventListener("click", (e) => { if (e.target === viewer) viewer.close(); });
viewer.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") show(at - 1); if (e.key === "ArrowRight") show(at + 1); });
</script>
</body>
</html>
