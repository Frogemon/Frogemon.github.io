<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAA · Handmade Woodwork</title>
<meta name="description" content="LAA: photos of handmade wood pieces.">
<meta name="theme-color" content="#1F2A23">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  /* forest-green band for the mark, then a workbench of prints on cream */
  :root { --forest: #1F2A23; --sage: #A9C3A6; --cream: #F2EEE6; --paper: #EFE9DE; --print: #FCFAF5; --oak: #B97A3E; color-scheme: light }
  * { box-sizing: border-box }
  html, body { margin: 0 }
  body { background: var(--paper); color: #1D2620; font: 16px/1.5 "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }

  header { background: radial-gradient(60% 120% at 50% 0%, rgb(169 195 166 / .2), transparent 70%), linear-gradient(170deg, #26342B, var(--forest) 70%);
    display: grid; justify-items: center; gap: 22px; padding: clamp(46px, 8vw, 88px) 20px clamp(40px, 6vw, 64px) }
  header img { width: clamp(140px, 20vw, 220px); height: auto; aspect-ratio: 100 / 75.83; filter: drop-shadow(0 16px 30px rgb(0 0 0 / .4)) }
  header .rule { width: 60px; height: 3px; border-radius: 3px; background: var(--oak) }

  /* the bench: prints laid out loosely, each tilted and nudged a little off its spot */
  .bench { max-width: 1180px; margin: 0 auto; padding: clamp(40px, 6vw, 80px) max(22px, env(safe-area-inset-left)) clamp(70px, 9vw, 120px);
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(26px, 4vw, 54px) clamp(18px, 3vw, 40px) }
  @media (max-width: 860px) { .bench { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
  .print { all: unset; box-sizing: border-box; display: block; cursor: zoom-in; position: relative;
    background: var(--print); padding: 10px 10px 34px; border-radius: 3px;
    box-shadow: 0 1px 1px rgb(31 42 35 / .08), 0 10px 24px -10px rgb(31 42 35 / .45), 0 30px 50px -34px rgb(31 42 35 / .5);
    transform: translate(var(--dx), var(--dy)) rotate(var(--r)); transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s }
  .print img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: #E7E0D2 }
  .print:hover, .print:focus-visible { transform: translate(var(--dx), calc(var(--dy) - 8px)) rotate(0deg) scale(1.03); z-index: 2;
    box-shadow: 0 2px 2px rgb(31 42 35 / .08), 0 22px 40px -14px rgb(31 42 35 / .5), 0 44px 70px -40px rgb(31 42 35 / .55) }
  .print:focus-visible { outline: 2px solid var(--oak); outline-offset: 6px }
  /* a strip of tape on some prints */
  .print.taped::before { content: ""; position: absolute; top: -12px; left: 50%; width: 76px; height: 24px; transform: translateX(-50%) rotate(calc(var(--r) * -1.6));
    background: rgb(233 222 196 / .82); box-shadow: 0 1px 2px rgb(0 0 0 / .08) }

  footer { display: flex; justify-content: center; padding: 0 20px 40px }
  footer img { width: 36px; height: auto; aspect-ratio: 100 / 75.83; opacity: .55 }

  /* viewer: the picked print flies up to fill the screen */
  .stage { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgb(18 24 20 / 0); transition: background .4s; touch-action: pan-y }
  .stage.open { background: rgb(18 24 20 / .9) }
  .stage[hidden] { display: none }
  .stage img { max-width: min(92vw, 1100px); max-height: 86svh; border-radius: 6px; box-shadow: 0 40px 90px -30px #000; background: var(--print); padding: 8px }
  .stage button { position: fixed; width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgb(242 238 230 / .14); color: var(--cream); font-size: 22px; cursor: pointer; opacity: 0; transition: opacity .3s, background .2s }
  .stage.open button { opacity: 1 }
  .stage button:hover { background: rgb(242 238 230 / .26) }
  .stage button:focus-visible { outline: 2px solid var(--oak) }
  #s-close { top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)) }
  #s-prev { left: max(14px, env(safe-area-inset-left)); top: 50% }
  #s-next { right: max(14px, env(safe-area-inset-right)); top: 50% }
  @media (prefers-reduced-motion: reduce) { .print, .stage { transition: none } .print { transform: none } .print:hover { transform: none } }
</style>
</head>
<body>
<header>
  <h1 class="sr">LAA</h1>
  <img src="logo-cream.svg" alt="LAA logo" width="220" height="167">
  <div class="rule"></div>
</header>

<main class="bench" id="bench" aria-label="Photos"></main>

<footer><img src="logo.svg" alt="" width="36" height="27"></footer>

<div class="stage" id="stage" hidden role="dialog" aria-modal="true" aria-label="Photo">
  <img id="s-img" alt="">
  <button id="s-prev" aria-label="Previous photo">‹</button>
  <button id="s-next" aria-label="Next photo">›</button>
  <button id="s-close" aria-label="Close">×</button>
</div>

<script>
// The photos. To add one: put the file in the photos folder and add a line, or swap a drawing for the real photo.
const PHOTOS = [
  { name: "Stargazing Chair", src: "photos/stargazing-chair.png" },
  { name: "Wine & Glass Caddy", src: "photos/drawn/caddy.jpg" },
  { name: "Wine Bottle Wind Chimes", src: "photos/drawn/chimes.jpg" },
  { name: "Magic Wine Holder", src: "photos/drawn/wine.jpg" },
  { name: "Folding Stool", src: "photos/drawn/stool.jpg" },
  { name: "Beer Flight", src: "photos/drawn/flight.jpg" },
];

const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const bench = document.getElementById("bench"), stage = document.getElementById("stage"), big = document.getElementById("s-img");
// fixed tilts and nudges so the pile looks tossed but stays the same on every visit
const TILT = [-3.2, 2.4, -1.4, 3.6, -2.6, 1.8, -3.8, 2.9, -1.9];
const NUDGE = [[0, 10], [6, -8], [-6, 18], [4, -4], [-8, 6], [6, 14], [-4, -6], [8, 8], [-6, 12]];
const prints = PHOTOS.map((p, i) => {
  const b = document.createElement("button");
  b.className = "print" + (i % 3 === 1 ? " taped" : "");
  b.style.setProperty("--r", TILT[i % TILT.length] + "deg");
  b.style.setProperty("--dx", NUDGE[i % NUDGE.length][0] + "px");
  b.style.setProperty("--dy", NUDGE[i % NUDGE.length][1] + "px");
  b.setAttribute("aria-label", "Open photo: " + p.name);
  const img = document.createElement("img");
  img.src = p.src; img.alt = p.name; img.loading = i < 3 ? "eager" : "lazy";
  b.appendChild(img);
  b.addEventListener("click", () => open(i));
  bench.appendChild(b);
  return b;
});

let at = -1;
// fly from the print's spot on the bench to the middle of the screen
function flyFrom(el) {
  if (still || !el) return;
  const a = el.getBoundingClientRect(), b = big.getBoundingClientRect();
  if (!b.width) return;
  big.animate([
    { transform: `translate(${a.left + a.width / 2 - (b.left + b.width / 2)}px, ${a.top + a.height / 2 - (b.top + b.height / 2)}px) scale(${a.width / b.width}) rotate(${el.style.getPropertyValue("--r")})` },
    { transform: "none" },
  ], { duration: 460, easing: "cubic-bezier(.2,.8,.2,1)" });
}
function open(i) {
  at = i;
  big.src = PHOTOS[i].src; big.alt = PHOTOS[i].name;
  stage.hidden = false;
  document.body.style.overflow = "hidden";
  stage.classList.add("open");
  (big.decode ? big.decode() : Promise.resolve()).catch(() => {}).finally(() => flyFrom(prints[i]));
  document.getElementById("s-close").focus();
}
function flip(d) {
  at = (at + d + PHOTOS.length) % PHOTOS.length;
  big.src = PHOTOS[at].src; big.alt = PHOTOS[at].name;
  if (!still) big.animate([{ opacity: 0, transform: `translateX(${d * 40}px)` }, { opacity: 1, transform: "none" }], { duration: 320, easing: "ease-out" });
}
function close() {
  stage.classList.remove("open");
  const done = () => { stage.hidden = true; document.body.style.overflow = ""; prints[at]?.focus(); };
  if (still) return done();
  const a = prints[at].getBoundingClientRect(), b = big.getBoundingClientRect();
  big.animate([{ transform: "none", opacity: 1 }, { transform: `translate(${a.left + a.width / 2 - (b.left + b.width / 2)}px, ${a.top + a.height / 2 - (b.top + b.height / 2)}px) scale(${a.width / b.width})`, opacity: .2 }],
    { duration: 380, easing: "cubic-bezier(.4,0,.2,1)" }).onfinish = done;
}
document.getElementById("s-close").onclick = close;
document.getElementById("s-prev").onclick = (e) => { e.stopPropagation(); flip(-1); };
document.getElementById("s-next").onclick = (e) => { e.stopPropagation(); flip(1); };
stage.addEventListener("click", (e) => { if (e.target === stage) close(); });
document.addEventListener("keydown", (e) => {
  if (stage.hidden) return;
  if (e.key === "Escape") close();
  if (e.key === "ArrowRight") flip(1);
  if (e.key === "ArrowLeft") flip(-1);
});
// swipe left/right on a phone to flip
let x0 = null;
stage.addEventListener("pointerdown", (e) => { x0 = e.clientX; });
stage.addEventListener("pointerup", (e) => { if (x0 !== null && Math.abs(e.clientX - x0) > 50 && e.target === big) flip(e.clientX < x0 ? 1 : -1); x0 = null; });
</script>
</body>
</html>
