<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAA · Handmade Woodwork</title>
<meta name="description" content="LAA: a gallery of handmade wood pieces.">
<meta name="theme-color" content="#141A16">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=satoshi@400,500,700&display=swap">
<style>
  /* palette: forest-night ground, brand green, cream, oiled-oak accent */
  :root {
    --night: #141A16; --forest: #1D2620; --sage: #9DB29C; --cream: #F2EEE6; --dim: #AEB8AD; --oak: #C98B4E; --line: rgb(242 238 230 / .12);
    --display: "Clash Display", "Segoe UI", system-ui, sans-serif;
    --body: "Satoshi", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--night); color: var(--cream); font: 17px/1.6 var(--body); -webkit-font-smoothing: antialiased }
  .wrap { max-width: 1160px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)) }

  /* hero: name on the left, the featured piece large on the right; stacks on phones */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: clamp(28px, 5vw, 64px); align-items: center; padding-block: clamp(36px, 7vw, 84px) 56px }
  @media (max-width: 760px) { .hero { grid-template-columns: 1fr; padding-top: 32px } }
  .brand { display: flex; align-items: center; gap: 18px }
  .brand img { width: clamp(64px, 9vw, 92px); height: auto; aspect-ratio: 100 / 75.83 }
  .hero h1 { font: 600 clamp(56px, 9vw, 104px)/1 var(--display); letter-spacing: .02em; margin: 0 }
  .hero p { margin: 22px 0 0; max-width: 32ch; color: var(--dim); font-size: clamp(17px, 1.8vw, 20px) }
  .rule { width: 56px; height: 2px; background: var(--oak); margin-top: 26px; border-radius: 2px }

  /* every photo sits in a fixed-shape frame, so nothing collapses while it loads */
  .frame { all: unset; box-sizing: border-box; display: block; width: 100%; aspect-ratio: 4 / 5; border-radius: 20px; overflow: hidden; position: relative; cursor: zoom-in;
    background: var(--forest); box-shadow: 0 30px 60px -30px rgb(0 0 0 / .8), 0 0 0 1px var(--line);
    transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .45s cubic-bezier(.2,.8,.2,1) }
  .frame:focus-visible { outline: 2px solid var(--oak); outline-offset: 4px }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s cubic-bezier(.2,.8,.2,1) }
  .frame:hover img { transform: scale(1.05) }
  .frame .tag { position: absolute; left: 14px; bottom: 14px; padding: 7px 12px; border-radius: 99px; background: rgb(20 26 22 / .72); backdrop-filter: blur(6px);
    font: 600 15px/1 var(--display); letter-spacing: .01em }

  /* more pieces, once there are several photos */
  .gallery { padding-block: 8px 72px }
  .gallery h2 { font: 600 clamp(26px, 3.4vw, 34px)/1 var(--display); letter-spacing: .01em; margin: 0 0 22px; padding-top: 26px; border-top: 1px solid var(--line) }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 20px }

  footer { border-top: 1px solid var(--line); padding-block: 24px 36px; color: var(--dim); font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
  footer img { width: 30px; height: auto; aspect-ratio: 100 / 75.83; vertical-align: middle; margin-right: 10px; opacity: .8 }

  /* lightbox */
  dialog { border: 0; padding: 0; background: transparent; max-width: min(94vw, 1100px); overflow: visible }
  dialog::backdrop { background: rgb(8 11 9 / .8); backdrop-filter: blur(14px) }
  dialog img { display: block; max-width: 100%; max-height: 82svh; border-radius: 16px }
  dialog p { margin: 14px 4px 0; font: 600 20px var(--display); display: flex; justify-content: space-between; gap: 12px }
  dialog p small { font: 500 13px var(--body); color: var(--dim) }
  .dlg-btn { position: absolute; top: 10px; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: rgb(20 26 22 / .75); color: var(--cream); font-size: 20px; cursor: pointer }
  .dlg-btn:focus-visible { outline: 2px solid var(--oak) }
  #close { right: 10px } #prev { left: 10px; top: 50% } #next { right: 10px; top: 50% }
  [hidden] { display: none !important }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important } .frame { transform: none !important } }
</style>
</head>
<body>
<section class="hero wrap">
  <div>
    <div class="brand"><img src="logo.svg" alt="LAA logo" width="92" height="70"><h1>LAA</h1></div>
    <div class="rule"></div>
  </div>
  <div id="feature"></div>
</section>

<section class="gallery wrap" id="more" hidden>
  <h2>More pieces</h2>
  <div class="grid" id="grid"></div>
</section>

<footer class="wrap"><span><img src="logo.svg" alt="" width="30" height="23">© LAA</span><span>Handmade woodwork</span></footer>

<dialog id="viewer" aria-label="Photo">
  <button class="dlg-btn" id="close" aria-label="Close">×</button>
  <button class="dlg-btn" id="prev" aria-label="Previous photo">‹</button>
  <button class="dlg-btn" id="next" aria-label="Next photo">›</button>
  <img id="big" alt="">
  <p><span id="caption"></span><small id="pos"></small></p>
</dialog>

<script>
// The gallery. The first photo is the big one at the top. To add a picture: put the file in the photos folder and add a line here.
const PHOTOS = [
  { name: "Stargazing Chair", photo: "photos/stargazing-chair.png" },
];

const viewer = document.getElementById("viewer");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let at = 0;

function show(i) {
  at = (i + PHOTOS.length) % PHOTOS.length;
  const p = PHOTOS[at], big = document.getElementById("big");
  big.src = p.photo; big.alt = p.name;
  document.getElementById("caption").textContent = p.name;
  document.getElementById("pos").textContent = PHOTOS.length > 1 ? `${at + 1} / ${PHOTOS.length}` : "";
  for (const id of ["prev", "next"]) document.getElementById(id).hidden = PHOTOS.length < 2;
  if (!viewer.open) viewer.showModal();
}

function frame(p, i) {
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "frame";
  btn.setAttribute("aria-label", "Open photo: " + p.name);
  btn.innerHTML = `<img alt=""><span class="tag"></span>`;
  btn.querySelector("img").src = p.photo;
  btn.querySelector("img").alt = p.name;
  btn.querySelector(".tag").textContent = p.name;
  btn.addEventListener("click", () => show(i));
  // a gentle 3D tilt toward the pointer
  if (!still) {
    btn.addEventListener("pointermove", (e) => {
      const r = btn.getBoundingClientRect();
      btn.style.setProperty("--ry", (((e.clientX - r.left) / r.width - 0.5) * 7).toFixed(2) + "deg");
      btn.style.setProperty("--rx", (-((e.clientY - r.top) / r.height - 0.5) * 7).toFixed(2) + "deg");
    });
    btn.addEventListener("pointerleave", () => { btn.style.removeProperty("--rx"); btn.style.removeProperty("--ry"); });
  }
  return btn;
}

if (PHOTOS.length) document.getElementById("feature").appendChild(frame(PHOTOS[0], 0));
if (PHOTOS.length > 1) {
  document.getElementById("more").hidden = false;
  PHOTOS.slice(1).forEach((p, j) => document.getElementById("grid").appendChild(frame(p, j + 1)));
}
document.getElementById("close").onclick = () => viewer.close();
document.getElementById("prev").onclick = () => show(at - 1);
document.getElementById("next").onclick = () => show(at + 1);
viewer.addEventListener("click", (e) => { if (e.target === viewer) viewer.close(); });
viewer.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") show(at - 1); if (e.key === "ArrowRight") show(at + 1); });
</script>
</body>
</html>
